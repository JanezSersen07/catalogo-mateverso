<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Catálogo de productos de ejemplo con buscador y filtros, hecho con HTML, CSS y JavaScript.">
  <title>Catálogo Mateverso</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="encabezado">
    <h1>Catálogo Mateverso</h1>
    <p>El universo del mate. Buscá y filtrá los productos.</p>
  </header>

  <main class="contenedor">
    <section class="filtros" aria-label="Filtros del catálogo">
      <div class="campo">
        <label for="buscador">Buscar</label>
        <input type="search" id="buscador" placeholder="Ej: bombilla, termo, yerba...">
      </div>

      <div class="campo">
        <label for="categoria">Categoría</label>
        <select id="categoria">
          <option value="todas">Todas</option>
        </select>
      </div>

      <label class="check">
        <input type="checkbox" id="solo-stock">
        Solo con stock
      </label>
    </section>

    <p id="contador" class="contador" aria-live="polite"></p>

    <section id="catalogo" class="grilla" aria-label="Productos"></section>

    <p id="mensaje" class="mensaje" hidden></p>
  </main>

  <footer class="pie">
    <p>Proyecto de portfolio · Productos y precios de ejemplo</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
